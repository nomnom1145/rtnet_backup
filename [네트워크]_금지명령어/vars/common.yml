---
## 레포트 변수
# report: securityvulnerability
# report: test
report: SHIN_test
system: network
today: "{{ lookup('pipe', 'date +%Y%m%d') }}"
file_path: "/fap/report/Network_점검/{{ today }}/{{ fap.job_id }}" # 위치 변경 가능

#### 엑셀 보고서를 위한 변수 설정 / 보고서의 경우 내가 실행한 명령어 순서대로 작성되어야 하기 때문에 필요한 변수 설정이다.
aggregated:
  data_list: >-
    {{ groups['all']
        | map('extract', hostvars, 'merged')
        | sum(start=[]) }}
job_info:
  job_id: "{{ hostvars[groups['all'][0]].fap.job_id }}"
  content_value: "{{ aggregated }}"
