- name: 3-가 사용자 접속로그 확인
  raw: |
    echo "실제 명령어 실행 계정=$(whoami)"
    grep Accepted /var/log/secure* | grep -v "::1" | awk '{print $9"\t"$11"\t"$14}' | sort | uniq
  register: login_result
  ignore_errors: false

# - name: 3-가 사용자 접속로그 결과 출력
