- name: Append work management rows
  set_fact:
    merged: "{{ merged + work_management_rows }}"
  vars:
    previous_work_management_text: >-
      {{
        (previous_work_management | default([], true) | join('\n'))
        if (previous_work_management | default([], true)) is sequence and (previous_work_management | default([], true)) is not string
        else (previous_work_management | default('') | string)
      }}
    current_work_management_text: >-
      {{
        (current_work_management | default([], true) | join('\n'))
        if (current_work_management | default([], true)) is sequence and (current_work_management | default([], true)) is not string
        else (current_work_management | default('') | string)
      }}
    work_management_rows:
      - cmd_id: '9a'
        name: 'Previous work management check'
