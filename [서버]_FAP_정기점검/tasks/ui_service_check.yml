---
- name: 3. 인벤토리 현황 트리구조 출력 확인 (현재 등록된 호스트 수)
  raw: "printf 'select count(*) from host_info where is_deleted = 0 and is_enable = 1 and business_type_id in (10, 11);' | docker exec -i -e PGPASSWORD='rt12345%' pg-0 psql -U nds -d fap -At"
  register: web_ui_result
  ignore_errors: false

# - name: 3. 현재 등록된 호스트 수 결과 출력
#   debug:
#     msg: |
#       WEB UI 상태 확인 결과

#       등록 호스트 수 : {{ web_ui_result.stdout | trim }}

################################################################################################

- name: 5. 조직/팀/사용자 관리 메뉴 확인 (현재 등록된 사용자 수)
  raw: "printf 'select count(*) from user_info where is_enable = 1 and is_deleted = 0;' | docker exec -i -e PGPASSWORD='rt12345%' pg-0 psql -U nds -d fap -At"
  register: user_count_result
  ignore_errors: false

# - name: 5. 현재 등록된 사용자 수 결과 출력
