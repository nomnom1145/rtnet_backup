- name: 2-나 인터페이스 설정 확인
  raw: |
    interface_file="/etc/sysconfig/network-scripts/ifcfg-ens160"

    grep -E '^(DEVICE|IPADDR|DNS1|DNS2)=' "${interface_file}"

    interface_name=$(awk -F= '/^DEVICE=/ {print $2}' "${interface_file}")

    echo "IF=${interface_name}"
  register: interface_result
  ignore_errors: false

# - name: 2-나 인터페이스 설정 결과 출력
