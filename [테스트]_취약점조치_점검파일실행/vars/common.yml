---
data_type: report
data_key: linux
system: linux
report: SHIN_check
today: "{{ lookup('pipe', 'date +%Y%m%d') }}"
file_path: "/fap/report/취약점_점검"

aggregated:
  data_list: >-
    {{
      groups['all']
      | map('extract', hostvars, 'content')
      | select('defined')
      | map(attribute='data_list')
      | list
      | sum(start=[])
    }}

job_info:
  job_id: "{{ hostvars[groups['all'][0]].fap.job_id }}"
  content_value: "{{ aggregated }}"

