---
- name: RedirFS check report
  hosts: all
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true

  vars_files:
    - "../vars/common.yml"
    - "../vars/command_list.yml"

  pre_tasks:
    - name: Initialize merged results
      set_fact:
        merged: []

    - name: Check connection
      include_tasks: "../tasks/con_check.yml"

  tasks:
    - name: Run RedirFS check command
      include_tasks: "../tasks/check_redirfs.yml"
      loop: "{{ version_check_commands }}"
      loop_control:
        loop_var: current_check_command
        index_var: current_check_index
      vars:
        current_command_text: >-
          {{
            current_check_command.command
            if current_check_command is mapping and current_check_command.command is defined
            else current_check_command
          }}
      when:
        - current_command_text not in (x_commands | default([], true))

    - name: Save report data
      fap.common.save_data:
        content:
          data_list: "{{ merged }}"
        protocol: http
        hostname: "{{ inventory_hostname }}"
        data_type: "{{ data_type }}"
        data_key: "{{ data_key }}"
        template_id: "{{ fap.template_id | default(omit) }}"
        job_id: "{{ fap.job_id | default(omit) }}"
      delegate_to: localhost
      register: db_save
      when: merged is defined and (merged | length) > 0

  post_tasks:
    - name: Aggregate report data
      set_fact:
        aggregated:
          data_list: >-
            {{
              ansible_play_hosts_all
              | map('extract', hostvars, 'merged')
              | select('defined')
              | list
              | flatten
            }}
      run_once: true
      delegate_to: localhost

    - name: Create Excel report
      include_tasks: "../tasks/make_report.yml"
      run_once: true
      when:
        - aggregated is defined
        - aggregated.data_list is defined
        - (aggregated.data_list | length) > 0
