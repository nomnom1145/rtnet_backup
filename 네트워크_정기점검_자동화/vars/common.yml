---
data_type: report
data_key: server
system: linux
report_type: periodic_network_check
today: "{{ lookup('pipe', 'python3 -c \"from datetime import datetime, timezone, timedelta; print(datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).strftime(\\\"%Y%m%d\\\"))\"') }}"
report_job_id: "{{ fap.job_id | default(fap_job_id | default('manual')) }}"
file_path: "/fap/report/{{ report_type }}/{{ today }}/{{ report_job_id }}"

### 입력 받아야 하는 변수
first_ip: "{{ FIRST_IP | default('') }}"
second_ip: "{{ SECOND_IP | default('') }}"
first_name: "{{ FIRST_NAME | default('') }}"
second_name: "{{ SECOND_NAME | default('') }}"
special_note: "{{ SPECIAL_NOTE | default('') }}"

job_info:
  file_path: "{{ file_path }}"
