- name: Print merged row count
  debug:
    msg: "merged rows prepared: {{ merged | length }}"

- name: Save report data
  become: false
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3.12
  fap.common.save_data:
    content:
      data_list: "{{ merged }}"
    protocol: http
    hostname: "{{ inventory_hostname }}"
    data_type: "{{ data_type }}"
    data_key: "{{ data_key }}"
    template_id: "{{ fap.template_id | default(omit) }}"
    job_id: "{{ fap.job_id | default(omit) }}"
  register: db_save
  when:
    - merged is defined
    - (merged | length) > 0
