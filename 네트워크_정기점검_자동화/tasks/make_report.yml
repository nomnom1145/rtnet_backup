---
- name: Prepare report filename
  set_fact:
    network_report_filename: "{{ lookup('pipe', 'TZ=Asia/Seoul date +%Y년_%m월_정기점검.xlsx') }}"
  run_once: true
  delegate_to: localhost

- name: Prepare report host order
  set_fact:
    first_host_key: "{{ first_ip | default(ansible_play_hosts_all[0] | default(''), true) }}"
    second_host_key: "{{ second_ip | default(ansible_play_hosts_all[1] | default(''), true) }}"
  run_once: true
  delegate_to: localhost

- name: Prepare report paths
  set_fact:
    network_report_dir: "{{ file_path }}"
    network_report_json_path: "/tmp/network_report_{{ fap.job_id | default('manual') }}.json"
    network_report_output_path: "{{ file_path }}/{{ network_report_filename }}"
  run_once: true
  delegate_to: localhost

- name: Build report input data
  set_fact:
    report_input_data:
      report_date: "{{ lookup('pipe', \"TZ=Asia/Seoul date '+%Y년 %m월 %d일'\") | trim }}"
      first_ip: "{{ first_host_key }}"
      second_ip: "{{ second_host_key }}"
      first_name: "{{ first_name | default('') }}"
      second_name: "{{ second_name | default('') }}"
      special_note: "{{ special_note | default('') }}"
      first_host:
        cpu_output: "{{ first_ref.get('cpu_usage', {}).get('stdout', '') | trim }}"
        disk_output: "{{ first_ref.get('disk_result', {}).get('stdout_lines', []) }}"
        memory_output: "{{ first_ref.get('mem_result', {}).get('stdout', '') | trim }}"
        routing_output: "{{ first_ref.get('routing_result', {}).get('stdout_lines', []) }}"
        interface_output: "{{ first_ref.get('interface_result', {}).get('stdout_lines', []) }}"
        login_output: "{{ first_ref.get('login_result', {}).get('stdout_lines', []) }}"
        process_output: "{{ first_ref.get('process_result', {}).get('stdout_lines', []) }}"
      second_host:
        cpu_output: "{{ second_ref.get('cpu_usage', {}).get('stdout', '') | trim }}"
        disk_output: "{{ second_ref.get('disk_result', {}).get('stdout_lines', []) }}"
        memory_output: "{{ second_ref.get('mem_result', {}).get('stdout', '') | trim }}"
        routing_output: "{{ second_ref.get('routing_result', {}).get('stdout_lines', []) }}"
        interface_output: "{{ second_ref.get('interface_result', {}).get('stdout_lines', []) }}"
        login_output: "{{ second_ref.get('login_result', {}).get('stdout_lines', []) }}"
        process_output: "{{ second_ref.get('process_result', {}).get('stdout_lines', []) }}"
      host_count: "{{ first_ref.get('web_ui_result', {}).get('stdout', '') | trim }}"
      user_count: "{{ first_ref.get('user_count_result', {}).get('stdout', '') | trim }}"
      schedule_count: "{{ first_ref.get('schedule_count_result', {}).get('stdout', '') | trim }}"
      notification_count: "{{ first_ref.get('notification_count_result', {}).get('stdout', '') | trim }}"
      template_count: "{{ first_ref.get('template_count_result', {}).get('stdout', '') | trim }}"
      sftp_output: "{{ first_ref.get('sftp_file_result', {}).get('stdout_lines', []) }}"
  vars:
    first_ref: "{{ hostvars[first_host_key] if first_host_key in hostvars else {} }}"
    second_ref: "{{ hostvars[second_host_key] if second_host_key in hostvars else {} }}"
  run_once: true
  delegate_to: localhost

- name: Ensure report output directory exists
  file:
    path: "{{ network_report_dir }}"
    state: directory
    mode: "0775"
  run_once: true
  delegate_to: localhost
  become: false

- name: Write report input json
  copy:
    dest: "{{ network_report_json_path }}"
    mode: "0644"
    content: "{{ report_input_data | to_nice_json }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Generate network report workbook
  command:
    argv:
      - /usr/bin/python3.12
      - "{{ playbook_dir }}/../scripts/generate_network_report.py"
      - "{{ playbook_dir }}/../templates/network_report_form.xlsx"
      - "{{ network_report_json_path }}"
      - "{{ network_report_output_path }}"
  register: network_report_generation
  run_once: true
  delegate_to: localhost
  become: false

- name: Print generated report path
  debug:
    var: network_report_generation.stdout
  run_once: true
  delegate_to: localhost
