- name: 8. 작업 템플릿 메뉴 확인 (현재 등록된 작업 템플릿 수)
  raw: "printf 'select count(*) from template_info where is_enable = 1 and is_deleted = 0 and template_type = $$J$$ and not (execute_permission = $$T$$ and task_count is null);' | docker exec -i -e PGPASSWORD='rt12345%' pg-0 psql -U nds -d fap -At"
  register: template_count_result
  ignore_errors: false  

# - name: 8. 현재 등록된 작업 템플릿 수 결과 출력
#   debug:
#     msg: |
#       작업템플릿 수 확인 결과

#       작업템플릿 수 : {{ template_count_result.stdout | trim }}

################################################################################################

- name: 13. SFTP 파일 메뉴 확인 (백업관리 SFTP 파일 목록)
  raw: "printf \"select file_name || '    ' || to_char(create_time, 'YYYY-MM-DD HH24:MI:SS') from sftp_files where create_time >= date_trunc('month', current_date) and create_time < date_trunc('month', current_date) + interval '1 month' order by create_time desc, file_name;\" | docker exec -i -e PGPASSWORD='rt12345%' pg-0 psql -U nds -d fap -At"
  register: sftp_file_result
  ignore_errors: false

# - name: 13. 백업관리 SFTP 파일 목록 결과 출력
#   debug:
#     msg: |
