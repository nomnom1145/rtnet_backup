- name: 7. 통보 설정 메뉴 확인 (현재 등록된 통보 수)
  raw: "printf 'select count(*) from notification_info;' | docker exec -i -e PGPASSWORD='rt12345%' pg-0 psql -U nds -d fap -At"
  register: notification_count_result
  ignore_errors: false

