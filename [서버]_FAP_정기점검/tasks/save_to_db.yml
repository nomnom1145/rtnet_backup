        host: "{{ fap.host_ip | default(inventory_hostname) }}"
        host_name: "{{ fap.host_ip | default(inventory_hostname) }}"
        hostname: "{{ inventory_hostname }}"
        ip: "{{ fap.host_ip | default(inventory_hostname) }}"
        system: "{{ system | default('linux') }}"
        report_type: "{{ report_type | default('periodic_server_check') }}"
        file_path: "{{ file_path | default('') }}"
        data_key: "{{ data_key | default('server') }}"
        output: "patch_day={{ os_patch_day | default('') }}, vulnerability={{ os_vulnerability | default('') }}, note={{ os_note | default('') }}"
        result: "patch_day={{ os_patch_day | default('') }}, vulnerability={{ os_vulnerability | default('') }}, note={{ os_note | default('') }}"
        message: ""
        failure_reason: ""
        is_success: 1
        is_pass: "{{ 0 if '[FAIL]' in ((os_vulnerability | default('') | string) | upper) else 1 }}"
        check_result: "{{ 'FAIL' if '[FAIL]' in ((os_vulnerability | default('') | string) | upper) else 'PASS' }}"
