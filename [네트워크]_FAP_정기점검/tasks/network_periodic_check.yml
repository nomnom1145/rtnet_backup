- name: 4-가 서버/WEB/DB 프로세스 기동 상태 확인
  raw: |
    printf "%-20s %-30s\n" "NAME" "STATUS"

    docker ps -a --format '{% raw %}{{.Names}}|{{.Status}}{% endraw %}' | while IFS='|' read -r name status
    do
      printf "%-20s %-30s\n" "$name" "$status"
    done
  register: process_result
  ignore_errors: false

