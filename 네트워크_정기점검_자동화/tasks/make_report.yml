---
- name: Prepare report filename
  set_fact:
    network_report_filename: "{{ lookup('pipe', 'TZ=Asia/Seoul date +%Y년_%m월_정기점검.xlsx') }}"
  run_once: true

- name: Prepare report host order
  set_fact:
    matched_report_hosts: >-
      {{
        ansible_play_hosts_all
        | map('extract', hostvars)
        | selectattr('fap', 'defined')
        | list
      }}
    first_host_key: ""
    second_host_key: ""
  run_once: true

- name: Resolve first report host
  set_fact:
    first_host_key: "{{ item }}"
  loop: "{{ ansible_play_hosts_all }}"
  when: >-
    (
      (hostvars[item].fap.host_ip | default(item)) == first_ip
    ) or (
      item == first_ip
    )
  run_once: true

- name: Resolve second report host
  set_fact:
    second_host_key: "{{ item }}"
  loop: "{{ ansible_play_hosts_all }}"
  when: >-
    (
      (hostvars[item].fap.host_ip | default(item)) == second_ip
    ) or (
      item == second_ip
    )
  run_once: true

- name: Apply fallback report host order
  set_fact:
    first_host_key: "{{ first_host_key | default(ansible_play_hosts_all[0] | default(''), true) }}"
    second_host_key: "{{ second_host_key | default(ansible_play_hosts_all[1] | default(''), true) }}"
  run_once: true

- name: Prepare report paths
  set_fact:
    network_report_dir: "{{ file_path }}"
    network_report_json_path: "/tmp/network_report_{{ fap.job_id | default('manual') }}.json"
    network_report_output_path: "{{ file_path }}/{{ network_report_filename }}"
  run_once: true

- name: Build report input data
  set_fact:
    report_input_data:
      report_date: "{{ lookup('pipe', \"TZ=Asia/Seoul date '+%Y년 %m월 %d일'\") | trim }}"
      first_ip: "{{ first_host_key }}"
      second_ip: "{{ second_host_key }}"
      first_name: "{{ first_name | default('') }}"
      second_name: "{{ second_name | default('') }}"
      special_note: "{{ special_note | default('') }}"
      first_host:
        cpu_output: "{{ (hostvars[first_host_key].cpu_usage.stdout | default('', true) | trim) if first_host_key in hostvars else '' }}"
        disk_output: "{{ (hostvars[first_host_key].disk_result.stdout_lines | default([], true)) if first_host_key in hostvars else [] }}"
        memory_output: "{{ (hostvars[first_host_key].mem_result.stdout | default('', true) | trim) if first_host_key in hostvars else '' }}"
        routing_output: "{{ (hostvars[first_host_key].routing_result.stdout_lines | default([], true)) if first_host_key in hostvars else [] }}"
        interface_output: "{{ (hostvars[first_host_key].interface_result.stdout_lines | default([], true)) if first_host_key in hostvars else [] }}"
        login_output: "{{ (hostvars[first_host_key].login_result.stdout_lines | default([], true)) if first_host_key in hostvars else [] }}"
        process_output: "{{ (hostvars[first_host_key].process_result.stdout_lines | default([], true)) if first_host_key in hostvars else [] }}"
      second_host:
        cpu_output: "{{ (hostvars[second_host_key].cpu_usage.stdout | default('', true) | trim) if second_host_key in hostvars else '' }}"
        disk_output: "{{ (hostvars[second_host_key].disk_result.stdout_lines | default([], true)) if second_host_key in hostvars else [] }}"
        memory_output: "{{ (hostvars[second_host_key].mem_result.stdout | default('', true) | trim) if second_host_key in hostvars else '' }}"
        routing_output: "{{ (hostvars[second_host_key].routing_result.stdout_lines | default([], true)) if second_host_key in hostvars else [] }}"
        interface_output: "{{ (hostvars[second_host_key].interface_result.stdout_lines | default([], true)) if second_host_key in hostvars else [] }}"
        login_output: "{{ (hostvars[second_host_key].login_result.stdout_lines | default([], true)) if second_host_key in hostvars else [] }}"
        process_output: "{{ (hostvars[second_host_key].process_result.stdout_lines | default([], true)) if second_host_key in hostvars else [] }}"
      host_count: "{{ (hostvars[first_host_key].web_ui_result.stdout | default('', true) | trim) if first_host_key in hostvars else '' }}"
      user_count: "{{ (hostvars[first_host_key].user_count_result.stdout | default('', true) | trim) if first_host_key in hostvars else '' }}"
      schedule_count: "{{ (hostvars[first_host_key].schedule_count_result.stdout | default('', true) | trim) if first_host_key in hostvars else '' }}"
      notification_count: "{{ (hostvars[first_host_key].notification_count_result.stdout | default('', true) | trim) if first_host_key in hostvars else '' }}"
      template_count: "{{ (hostvars[first_host_key].template_count_result.stdout | default('', true) | trim) if first_host_key in hostvars else '' }}"
      sftp_output: "{{ (hostvars[first_host_key].sftp_file_result.stdout_lines | default([], true)) if first_host_key in hostvars else [] }}"
  run_once: true

- name: Ensure report output directory exists
  file:
    path: "{{ network_report_dir }}"
    state: directory
    mode: "0775"
  run_once: true
  delegate_to: localhost
  become: false

- name: Write report input json
  copy:
    dest: "{{ network_report_json_path }}"
    mode: "0644"
    content: "{{ report_input_data | to_nice_json }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Generate network report workbook
  command:
    argv:
      - /usr/bin/python3.12
      - "{{ playbook_dir }}/../scripts/generate_network_report.py"
      - "{{ playbook_dir }}/../templates/network_report_form.xlsx"
      - "{{ network_report_json_path }}"
      - "{{ network_report_output_path }}"
  register: network_report_generation
  run_once: true
  delegate_to: localhost
  become: false

- name: Print generated report path
  debug:
    var: network_report_generation.stdout
  run_once: true
  delegate_to: localhost
