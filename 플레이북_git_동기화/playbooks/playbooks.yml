---
- name: Git 동기화 결과를 메일로 전송 자동화
  hosts: all
  gather_facts: false

  vars_files:
    - "../vars/common.yml" # 공통변수
    - "../templates/vault_mail.yml"     # 새로운 서버에 복사해서 넣을 파일 Ansible_valut 암호화 문자열 
                                        # mail 정보 암호화 파일
  tasks:
    - name: Git 저장소 Clone 또는 Pull 수행
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_dest_path }}"
        version: main
        update: true
        accept_hostkey: true
      environment:
        GIT_SSH_COMMAND: >-
          ssh
          -i {{ git_ssh_key_path }}
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=accept-new
      register: git_result
      delegate_to: localhost

    - name: 스크립트 파일 실행
      command:
        argv:
          - sh
          - "{{ git_sync_script_path }}"
      register: sh_test
      changed_when: true
      delegate_to: localhost
      ignore_errors: true
      environment:
        GIT_SSH_COMMAND: >-
          ssh
          -i {{ git_ssh_key_path }}
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=accept-new

    - name: 작업 결과 메일 전송
      include_tasks: "../tasks/send_mail.yml"